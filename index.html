<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MA1 GAME</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;overflow:hidden}.header{padding:15px;background:#111;border-bottom:2px solid #ff0040}h1{margin:0;color:#ff0040}#game{position:relative;width:100%;height:65vh;background:linear-gradient(#111,#222);overflow:hidden;border-bottom:2px solid #ff0040}#player{position:absolute;bottom:20px;left:50px;width:40px;height:40px;background:#ff0040;border-radius:8px;box-shadow:0 0 15px #ff0040}.obstacle{position:absolute;bottom:20px;width:30px;height:50px;background:#fff;border-radius:5px}#score{font-size:22px;margin:15px}.btn{padding:12px 25px;background:#ff0040;border:none;color:#fff;border-radius:10px;font-size:18px}</style></head><body><div class="header"><h1>MA1 TEAM</h1></div><div id="score">النقاط: 0</div><div id="game"><div id="player"></div></div><button class="btn" onclick="startGame()">ابدأ اللعب ▶️</button><p>اضغط الشاشة عشان تنط</p><script>let p=document.getElementById('player'),g=document.getElementById('game'),s=document.getElementById('score'),sc=0,j=false,ov=false,it;function jump(){if(j||ov)return;j=true;let h=0;let u=setInterval(()=>{if(h>=120){clearInterval(u);let d=setInterval(()=>{if(h<=0){clearInterval(d);j=false;}h-=10;p.style.bottom=(20+h)+'px';},20);}h+=10;p.style.bottom=(20+h)+'px';},20);}function startGame(){sc=0;ov=false;s.innerText='النقاط: 0';document.querySelectorAll('.obstacle').forEach(e=>e.remove());clearInterval(it);it=setInterval(()=>{let o=document.createElement('div');o.className='obstacle';o.style.left='100%';g.appendChild(o);let pos=g.offsetWidth;let m=setInterval(()=>{if(ov){clearInterval(m);return;}pos-=8;o.style.left=pos+'px';let pr=p.getBoundingClientRect(),or=o.getBoundingClientRect();if(!(pr.right<or.left||pr.left>or.right||pr.bottom<or.top||pr.top>or.bottom)){ov=true;alert('انتهت! نقاطك: '+sc);clearInterval(it);}if(pos<-30){clearInterval(m);o.remove();sc++;s.innerText='النقاط: '+sc;}},20);},1500);}document.addEventListener('touchstart',jump);g.addEventListener('click',jump);</script></body></html>
