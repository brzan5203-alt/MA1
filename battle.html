<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MA1 BATTLE</title>
<style>
body{margin:0;background:#0d0d0d;color:white;font-family:Arial;overflow:hidden}
#lobby{position:absolute;inset:0;background:radial-gradient(#222,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.shop{display:flex;gap:10px;margin:15px;flex-wrap:wrap;justify-content:center}
.card{background:#1a1a1a;border:2px solid #333;padding:12px;border-radius:12px;width:110px;text-align:center}
.card.active{border-color:gold;background:#2a2410}
button{padding:12px 25px;border:none;border-radius:20px;font-weight:bold}
#play{background:gold;font-size:22px}
canvas{display:block}
#hud{position:absolute;top:0;width:100%;display:flex;justify-content:space-around;padding:8px;font-weight:bold;z-index:5}
</style>
</head>
<body>
<div id="lobby">
<h1>🔫 MA1 BATTLE ROYALE</h1>
<div>💰 فلوسك: <span id="cash">0</span></div>
<div class="shop" id="shop"></div>
<button id="play" onclick="startBattle()">▶️ ابدأ القيم</button>
<p style="opacity:0.6;font-size:12px">كل بوت تذبحه = 50 فلوس | السلاح يطور كل 500</p>
</div>
<div id="hud"><div id="hp">❤️ 100</div><div id="kills">💀 0</div><div id="ammo">🔫 30</div></div>
<canvas id="g"></canvas>
<script>
const c=document.getElementById('g'),X=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let weapons=[
{id:0,name:'مسدس',emoji:'🔫',dmg:15,price:0,fire:350},
{id:1,name:'شوزن',emoji:'💥',dmg:35,price:500,fire:600},
{id:2,name:'رشاش',emoji:'🔥',dmg:22,price:1000,fire:150},
{id:3,name:'سنايبر',emoji:'🎯',dmg:80,price:1500,fire:900},
{id:4,name:'بازوكا',emoji:'🚀',dmg:120,price:2000,fire:1200}
];
let cash=parseInt(localStorage.getItem('ma1_battle_cash')||0);
let owned=JSON.parse(localStorage.getItem('ma1_owned')||'[0]');
let selected=parseInt(localStorage.getItem('ma1_sel')||0);
let player,bots=[],bullets=[],run=false,kills=0;

function renderShop(){
 let h=document.getElementById('shop'); h.innerHTML='';
 weapons.forEach(w=>{
  let price = w.id===0?0:500 + (w.id-1)*500;
  w.price=price;
  let has=owned.includes(w.id);
  h.innerHTML+=`<div class="card ${selected===w.id?'active':''}" onclick="selectW(${w.id})"><div style="font-size:30px">${w.emoji}</div><b>${w.name}</b><br><small>دمج ${w.dmg}</small><br>${has?'<span style=color:lime>مملوك</span>':`💰 ${price}<br><button onclick="buy(${w.id});event.stopPropagation()" style="background:gold;margin-top:5px;padding:5px 10px">شراء</button>`}</div>`;
 });
 document.getElementById('cash').innerText=cash;
}
function buy(id){
 let w=weapons[id];
 if(cash>=w.price &&!owned.includes(id)){ cash-=w.price; owned.push(id); selected=id; save(); renderShop(); }else if(cash<w.price){ alert('فلوسك ما تكفي!'); }
}
function selectW(id){ if(owned.includes(id)){ selected=id; save(); renderShop(); } }
function save(){ localStorage.setItem('ma1_battle_cash',cash); localStorage.setItem('ma1_owned',JSON.stringify(owned)); localStorage.setItem('ma1_sel',selected); }

renderShop();

function startBattle(){
 document.getElementById('lobby').style.display='none';
 player={x:c.width/2,y:c.height/2,hp:100,ang:0,ammo:30};
 bots=[]; bullets=[]; kills=0; run=true;
 for(let i=0;i<8;i++) bots.push({x:Math.random()*c.width,y:Math.random()*c.height,hp:60+Math.random()*40,ang:0,cd:0});
 loop();
}
let mouse={x:c.width/2,y:c.height/2};
let keys={};
function loop(){
 if(!run) return;
 X.fillStyle='#1b2b1b'; X.fillRect(0,0,c.width,c.height);
 X.strokeStyle='#2a2a2a'; for(let i=0;i<c.width;i+=60){ X.beginPath(); X.moveTo(i,0); X.lineTo(i,c.height); X.stroke(); } for(let i=0;i<c.height;i+=60){ X.beginPath(); X.moveTo(0,i); X.lineTo(c.width,i); X.stroke(); }

 // player move
 let speed=3.5;
 if(keys['w']||keys['ArrowUp']) player.y-=speed;
 if(keys['s']||keys['ArrowDown']) player.y+=speed;
 if(keys['a']||keys['ArrowLeft']) player.x-=speed;
 if(keys['d']||keys['ArrowRight']) player.x+=speed;
 player.x=Math.max(20,Math.min(c.width-20,player.x));
 player.y=Math.max(20,Math.min(c.height-20,player.y));
 player.ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);

 // draw player
 X.save(); X.translate(player.x,player.y); X.rotate(player.ang);
 X.font='32px Arial'; X.fillText('🧑‍🚀',0,8); X.fillStyle='white'; X.font='18px Arial'; X.fillText(weapons[selected].emoji,22,5);
 X.restore();

 // bots AI
 bots.forEach((b,bi)=>{
  let d=Math.hypot(player.x-b.x,player.y-b.y);
  b.ang=Math.atan2(player.y-b.y,player.x-b.x);
  b.x+=Math.cos(b.ang)*1.2; b.y+=Math.sin(b.ang)*1.2;
  X.save(); X.translate(b.x,b.y); X.rotate(b.ang); X.font='32px Arial'; X.fillText('🤖',0,8); X.restore();
  X.fillStyle='red'; X.fillRect(b.x-20,b.y-25,b.hp/2,5);
  b.cd--; if(d<350 && b.cd<=0){ bullets.push({x:b.x,y:b.y,ang:b.ang,enemy:true,dmg:10}); b.cd=60; }
  if(d<25){ player.hp-=0.5; }
  bullets.forEach((bu,ui)=>{
   if(!bu.enemy && Math.hypot(b.x-bu.x,b.y-bu.y)<22){ b.hp-=bu.dmg; bullets.splice(ui,1); if(b.hp<=0){ bots.splice(bi,1); kills++; cash+=50; if(bots.length<8) bots.push({x:Math.random()*c.width,y:Math.random()*c.height,hp:80,ang:0,cd:0}); } }
  });
 });
 // bullets
 bullets.forEach((b,i)=>{
  b.x+=Math.cos(b.ang)*9; b.y+=Math.sin(b.ang)*9;
  X.fillStyle=b.enemy?'red':'gold'; X.beginPath(); X.arc(b.x,b.y,5,0,Math.PI*2); X.fill();
  if(b.enemy && Math.hypot(player.x-b.x,player.y-b.y)<20){ player.hp-=b.dmg; bullets.splice(i,1); }
  if(b.x<0||b.x>c.width||b.y<0||b.y>c.height) bullets.splice(i,1);
 });

 document.getElementById('hp').innerText='❤️ '+Math.floor(player.hp);
 document.getElementById('kills').innerText='💀 '+kills+' | 💰 '+cash;
 document.getElementById('ammo').innerText=weapons[selected].emoji+' '+weapons[selected].name;

 if(player.hp<=0){ run=false; save(); alert('💀 مت! ذبحت '+kills+' بوت وجمعت '+(kills*50)+' فلوس'); document.getElementById('lobby').style.display='flex'; renderShop(); }

 requestAnimationFrame(loop);
}
let lastShot=0;
window.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
window.addEventListener('touchmove',e=>{ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; });
c.addEventListener('mousedown',shoot); c.addEventListener('touchstart',shoot);
function shoot(){
 let now=Date.now(), w=weapons[selected];
 if(now-lastShot < w.fire) return;
 lastShot=now;
 bullets.push({x:player.x,y:player.y,ang:player.ang,enemy:false,dmg:w.dmg});
}
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
</script>
</body>
</html>
