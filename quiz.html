<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA1 200 QUIZ</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial;text-align:center;padding:15px}
.card{background:#1e293b;max-width:600px;margin:auto;padding:20px;border-radius:18px}
button{width:100%;padding:12px;margin:5px 0;background:#334155;color:#fff;border:0;border-radius:10px;font-weight:bold}
button:hover{background:#facc15;color:#000}
</style>
</head>
<body>
<h1>🔥 MA1 QUIZ - 200 سؤال متوسط 🔥</h1>
<div id="progress"></div><div id="timer">⏱️ 15</div>
<div class="card"><div id="q"></div><div id="opts"></div><div id="score">السكور: 0</div></div>
<script>
const base=[
{q:"سعر فاكهة النمر؟",a:["3000","2500","3500"],c:0},
{q:"فاكهة الزلزال اسمها؟",a:["Quake","Flame","Ice"],c:0},
{q:"من وين كارتيه القرش؟",a:["رجل القرش Sea2","الثلج","البداية"],c:0},
{q:"كم بوس في Sea2؟",a:["11","8","20"],c:0},
{q:"كيف تجيب توشيتا؟",a:["لغز Torch","30 Elite","2M"],c:0},
{q:"اقوى سيف؟",a:["CDK / Yama","Cutlass","Katana"],c:0},
{q:"جزيرة المصنع؟",a:["Factory","Hydra","Hot&Cold"],c:0},
{q:"كم نوع هاكي؟",a:["3","2","1"],c:0},
{q:"شرط ايقاظ الفاكهة؟",a:["Raid","قتل بوس","شراء"],c:0},
{q:"من وين Godhuman؟",a:["جزيرة القمح Sea3","Sea1","الثلج"],c:0},
{q:"سعر التنين؟",a:["3500","3000","4000"],c:0},
{q:"فاكهة الضوء تطير؟",a:["نعم","لا","احيانا"],c:0},
{q:"لفل دخول Sea3؟",a:["1500","1000","2000"],c:0},
{q:"Soul Guitar من وين؟",a:["Graveyard","Shop","Factory"],c:0},
{q:"Fist of Darkness؟",a:["يستدعي Blackbeard","فلوس","زينة"],c:0}
];
let quiz=[]; for(let k=0;k<200;k++){ let b=base[k%base.length]; quiz.push({q:`${k+1}. ${b.q}`,a:b.a,c:b.c}); }

let i=0,sc=0,time=15,t;
function load(){
 if(i>=quiz.length){q.innerHTML=`خلصت! سكورك ${sc}/200`;opts.innerHTML=`<button onclick="location.reload()">إعادة</button>`;clearInterval(t);return}
 progress.innerText=`سؤال ${i+1} / 200`;
 q.innerHTML=`<h3>${quiz[i].q}</h3>`; let h=""; quiz[i].a.forEach((o,ix)=>h+=`<button onclick="check(${ix})">${o}</button>`); opts.innerHTML=h; time=15;
}
function check(ix){ if(ix===quiz[i].c) sc++; score.innerText=`السكور: ${sc}`; i++; load(); }
load();
t=setInterval(()=>{time--; timer.innerText=`⏱️ ${time}`; if(time<=0){i++; load();}},1000);
</script>
</body>
</html>
