<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MA1 ZOMBIE</title>
<style>
body{margin:0;background:#0a0a0a;overflow:hidden;color:white;font-family:Arial;text-align:center}
canvas{display:block;margin:0 auto;background:#111}
#ui{position:absolute;top:10px;left:0;width:100%;display:flex;justify-content:space-around;font-size:20px;font-weight:bold}
#score{color:gold} #hp{color:red}
#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff0000;padding:20px 40px;border:none;color:white;font-size:22px;border-radius:10px}
</style>
</head>
<body>
<div id="ui"><div id="score">SCORE: 0</div><div id="hp">HP: 100</div></div>
<canvas id="game"></canvas>
<button id="start" onclick="startGame()">▶️ ابدأ MA1 ZOMBIE</button>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
c.width=window.innerWidth; c.height=window.innerHeight;
let player={x:c.width/2,y:c.height/2,r:20,hp:100}, bullets=[], zombies=[], score=0, running=false, mouse={x:0,y:0};

function startGame(){
 document.getElementById('start').style.display='none';
 running=true; score=0; player.hp=100; bullets=[]; zombies=[];
 loop();
 setInterval(()=>{if(running)spawnZombie()},1200);
}
function spawnZombie(){
 let angle=Math.random()*Math.PI*2;
 let r=Math.max(c.width,c.height)/1.5;
 zombies.push({x:player.x+Math.cos(angle)*r, y:player.y+Math.sin(angle)*r, r:18, speed:0.8+Math.random()*1.2});
}
function loop(){
 if(!running) return;
 ctx.clearRect(0,0,c.width,c.height);
 // player
 ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();
 // bullets
 bullets.forEach((b,i)=>{
  b.x+=b.vx; b.y+=b.vy;
  ctx.fillStyle='yellow'; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
  if(b.x<0||b.x>c.width||b.y<0||b.y>c.height) bullets.splice(i,1);
 });
 // zombies
 zombies.forEach((z,zi)=>{
  let a=Math.atan2(player.y-z.y, player.x-z.x);
  z.x+=Math.cos(a)*z.speed; z.y+=Math.sin(a)*z.speed;
  ctx.fillStyle='#ff3333'; ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,Math.PI*2); ctx.fill();
  // hit player
  if(Math.hypot(player.x-z.x, player.y-z.y)<player.r+z.r){ player.hp-=1; document.getElementById('hp').innerText='HP: '+player.hp; if(player.hp<=0){ running=false; alert('GAME OVER MA1! سكورك: '+score); location.reload(); } }
  // hit by bullet
  bullets.forEach((b,bi)=>{
   if(Math.hypot(z.x-b.x, z.y-b.y)<z.r+5){ zombies.splice(zi,1); bullets.splice(bi,1); score+=10; document.getElementById('score').innerText='SCORE: '+score; }
  });
 });
 requestAnimationFrame(loop);
}
c.addEventListener('mousemove',e=>mouse={x:e.clientX,y:e.clientY});
c.addEventListener('click',()=>{
 if(!running) return;
 let a=Math.atan2(mouse.y-player.y, mouse.x-player.x);
 bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8});
});
c.addEventListener('touchstart',e=>{
 let t=e.touches[0]; mouse={x:t.clientX,y:t.clientY};
 let a=Math.atan2(mouse.y-player.y, mouse.x-player.x);
 bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8});
});
</script>
</body>
</html>
