<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 جزر القراصنة</title>
<style>
body{margin:0;overflow:hidden;font-family:Tahoma;background:#0a2a4a}
#ui{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:10;pointer-events:none;gap:6px;flex-wrap:wrap}
.panel{background:rgba(0,0,0,0.8);color:#fff;padding:8px 12px;border-radius:10px;border:2px solid #d4a017;font-size:12px}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}
#cross:before,#cross:after{content:'';position:absolute;background:#fff}
#cross:before{width:2px;height:20px;left:9px;top:0}#cross:after{width:20px;height:2px;top:9px;left:0}
#act{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(#d4a017,#8b6508);color:#000;padding:12px 18px;border-radius:20px;display:none;z-index:15;font-weight:bold;text-align:center;min-width:260px}
#bag{position:fixed;top:70px;right:8px;width:230px;background:rgba(20,15,5,0.95);border:2px solid #d4a017;border-radius:12px;padding:10px;color:#fff;display:none;z-index:12;font-size:12px}
#block{position:fixed;inset:0;background:radial-gradient(rgba(0,10,30,0.6),rgba(0,0,0,0.95));display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:20;cursor:pointer;text-align:center;padding:15px}
#block h1{font-size:32px;color:#d4a017;margin:5px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui"><div class="panel">💰<span id="gold">150</span> | 💎<span id="gems">0</span> | ⚔️لفل <span id="sl">0</span> دمج <span id="sd">5</span> | 🛶لفل <span id="bl">1</span><br><span id="is">جزيرة البداية</span></div><div class="panel" style="pointer-events:auto" onclick="toggleBag()">🎒 B</div></div>
<div id="cross"></div><div id="act"></div>
<div id="bag"><h3 style="margin:0 0 6px;color:#d4a017">🎒 الجنطة</h3><div id="blist"></div></div>
<div id="block"><h1>🏴‍☠️ 5 جزر القراصنة</h1><p>البداية: محل سيوف 50,100,150 | محل قوارب 100,200 | راعي جواهر 500</p><p style="background:#d4a017;color:#000;padding:10px 22px;border-radius:20px;font-weight:bold;margin-top:12px">اضغط للعب ▶️</p></div>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a2a4a);scene.fog=new THREE.Fog(0x0a2a4a,100,650);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.75));const sun=new THREE.DirectionalLight(0xfff5cc,1);sun.position.set(200,250,100);scene.add(sun);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0x0e4d6e}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-1;scene.add(ocean);
const islands=[{name:"جزيرة البداية",pos:{x:0,z:0},r:90,c:0x2d6a4f,t:"start"},{name:"جزيرة الهياكل",pos:{x:300,z:200},r:70,c:0x8d7a5a,t:"battle",clear:false},{name:"جزيرة البركان",pos:{x:-350,z:250},r:75,c:0x8b2500,t:"battle",clear:false},{name:"جزيرة الجليد",pos:{x:400,z:-300},r:70,c:0xcceeff,t:"battle",clear:false},{name:"جزيرة الاشباح",pos:{x:-300,z:-350},r:80,c:0x3a3a4a,t:"battle",clear:false},{name:"جزيرة الذهب",pos:{x:0,z:500},r:85,c:0xd4a017,t:"battle",clear:false},];
islands.forEach(is=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(is.r,is.r*0.9,8,16),new THREE.MeshStandardMaterial({color:is.c}));m.position.set(is.pos.x,2,is.pos.z);scene.add(m);const ring=new THREE.Mesh(new THREE.RingGeometry(is.r-2,is.r+8,32),new THREE.MeshStandardMaterial({color:0xe9c46a,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(is.pos.x,0.2,is.pos.z);scene.add(ring);});
function makeShop(x,z,col){const b=new THREE.Mesh(new THREE.BoxGeometry(12,10,12),new THREE.MeshStandardMaterial({color:col}));b.position.set(x,5,z);scene.add(b);return b;}
const swordShop=makeShop(-15,-10,0x888888),boatShop=makeShop(15,-10,0x8b4513),jewelShop=makeShop(0,15,0x00aa88);
let boat=null,boatLvl=1,inBoat=false;function createBoat(){if(boat)scene.remove(boat);const g=new THREE.Group();const hull=new THREE.Mesh(new THREE.BoxGeometry(8,2,18),new THREE.MeshStandardMaterial({color:0x5d4037}));const deck=new THREE.Mesh(new THREE.BoxGeometry(6,0.5,14),new THREE.MeshStandardMaterial({color:0xd4a017}));deck.position.y=1.2;g.add(hull,deck);g.position.set(20,1,20);scene.add(g);boat=g;}createBoat();
let gold=150,gems=0,swordLvl=0,curIsland=0,monsters=[],treasures=[];
const getSwordPrice=()=>50*(swordLvl+1),getBoatPrice=()=>100*boatLvl,getDmg=()=>5+swordLvl*12,getBoatSp=()=>0.2+boatLvl*0.12;
function upd(){document.getElementById('gold').textContent=gold;document.getElementById('gems').textContent=gems;document.getElementById('sl').textContent=swordLvl;document.getElementById('bl').textContent=boatLvl;document.getElementById('sd').textContent=getDmg();let h=`<div>⚔️ سيف لفل ${swordLvl} دمج ${getDmg()}</div><div>🛶 قارب لفل ${boatLvl}</div><div>💎 ${gems} جوهرة</div>`;islands.forEach((is,i)=>{h+=`<div style="font-size:10px">${is.name}: ${is.t==='start'?'🏠':(is.clear?'✅':'👹')}</div>`});document.getElementById('blist').innerHTML=h;}upd();
const swordG=new THREE.Group();const blade=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.12,3.5),new THREE.MeshStandardMaterial({color:0xcccccc}));blade.position.z=-1.7;const han=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,0.7),new THREE.MeshStandardMaterial({color:0x8b4513}));han.rotation.x=Math.PI/2;han.position.z=-0.2;swordG.add(blade,han);swordG.position.set(0.7,-0.45,-1.1);swordG.visible=false;
const controls=new PointerLockControls(camera,document.body);controls.getObject().add(swordG);scene.add(controls.getObject());controls.getObject().position.set(0,5,0);
const block=document.getElementById('block');block.addEventListener('click',()=>controls.lock());controls.addEventListener('lock',()=>{block.style.display='none';swordG.visible=!inBoat;});controls.addEventListener('unlock',()=>block.style.display='flex');
function spawnM(idx){monsters.forEach(m=>scene.remove(m));monsters=[];treasures.forEach(t=>scene.remove(t));treasures=[];if(islands[idx].t==='start'||islands[idx].clear)return;const is=islands[idx];for(let i=0;i<3+idx;i++){const a=Math.random()*Math.PI*2,r=Math.random()*is.r*0.6,x=is.pos.x+Math.cos(a)*r,z=is.pos.z+Math.sin(a)*r;const col=[0x8b0000,0xff4400,0x4444ff,0x222222,0xffd700][idx%5];const m=new THREE.Mesh(new THREE.CapsuleGeometry(1.1,3.2,4,8),new THREE.MeshStandardMaterial({color:col}));m.position.set(x,3,z);m.userData={hp:30+idx*15,alive:true,isl:idx};scene.add(m);monsters.push(m);}}function spawnT(idx){const is=islands[idx];const chest=new THREE.Mesh(new THREE.BoxGeometry(5,3,4),new THREE.MeshStandardMaterial({color:0xd4a017}));chest.position.set(is.pos.x,2,is.pos.z);chest.userData={isl:idx,type:'treasure'};scene.add(chest);treasures.push(chest);}
const act=document.getElementById('act');let near=null;function checkNear(){const p=controls.getObject().position;let minD=Infinity,cur=0;islands.forEach((is,i)=>{const d=Math.hypot(p.x-is.pos.x,p.z-is.pos.z);if(d<minD){minD=d;cur=i;}});curIsland=cur;document.getElementById('is').textContent=islands[cur].name;let f=null;if(cur===0){if(Math.hypot(p.x-swordShop.position.x,p.z-swordShop.position.z)<15)f={t:'sword',pr:getSwordPrice()};else if(Math.hypot(p.x-boatShop.position.x,p.z-boatShop.position.z)<15)f={t:'boat',pr:getBoatPrice()};else if(Math.hypot(p.x-jewelShop.position.x,p.z-jewelShop.position.z)<15)f={t:'jewel'};}if(!inBoat&&boat&&Math.hypot(p.x-boat.position.x,p.z-boat.position.z)<12)f={t:'boatEnter'};if(inBoat)f={t:'boatExit'};treasures.forEach(tt=>{if(Math.hypot(p.x-tt.position.x,p.z-tt.position.z)<10)f={t:'treasure',o:tt};});near=f;if(f){act.style.display='block';if(f.t==='sword')act.textContent=`⚔️ سيف لفل ${swordLvl+1} - ${f.pr} ذهب [E]`;else if(f.t==='boat')act.textContent=`🛶 قارب لفل ${boatLvl+1} - ${f.pr} ذهب [E]`;else if(f.t==='jewel')act.textContent=gems>0?`💎 بيع ${gems} جوهرة [E]`: `💎 راعي الجواهر`;else if(f.t==='boatEnter')act.textContent=`🛶 اركب [E]`;else if(f.t==='boatExit')act.textContent=`🛶 انزل [E]`;else if(f.t==='treasure')act.textContent=`💰 كنز 500 [E]`;}else act.style.display='none';}
function interact(){if(!near)return;if(near.t==='sword'){if(gold>=near.pr){gold-=near.pr;swordLvl++;blade.material.color.setHSL(0.1+swordLvl*0.07,0.85,0.5);blade.scale.z=1+swordLvl*0.18;upd();} }else if(near.t==='boat'){if(gold>=near.pr){gold-=near.pr;boatLvl++;createBoat();upd();}}else if(near.t==='jewel'){if(gems>0){gold+=gems*500;gems=0;upd();}}else if(near.t==='boatEnter'){inBoat=true;controls.getObject().position.copy(boat.position);controls.getObject().position.y=3;swordG.visible=false;}else if(near.t==='boatExit'){inBoat=false;const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();controls.getObject().position.add(f.multiplyScalar(-8));controls.getObject().position.y=5;boat.position.copy(controls.getObject().position);boat.position.y=1;boat.position.add(f.multiplyScalar(5));swordG.visible=true;}else if(near.t==='treasure'){scene.remove(near.o);treasures=treasures.filter(t=>t!==near.o);gems++;islands[near.o.userData.isl].clear=true;upd();}}
let canAtk=true;renderer.domElement.addEventListener('click',()=>{if(!controls.isLocked||!canAtk||inBoat)return;canAtk=false;swordG.rotation.x=-0.9;setTimeout(()=>swordG.rotation.x=0,140);const o=new THREE.Vector3();controls.getObject().getWorldPosition(o);const d=new THREE.Vector3();camera.getWorldDirection(d);const ray=new THREE.Raycaster(o,d,0,6);const hits=ray.intersectObjects(monsters);if(hits.length){const t=hits[0].object;if(t.userData.alive){t.userData.hp-=getDmg();if(t.userData.hp<=0){t.userData.alive=false;scene.remove(t);monsters=monsters.filter(m=>m!==t);gold+=15+curIsland*5;upd();if(monsters.length===0)spawnT(curIsland);}}}setTimeout(()=>canAtk=true,280);});
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyB')toggleBag();if(e.code==='KeyE')interact();});addEventListener('keyup',e=>keys[e.code]=false);window.toggleBag=()=>{const b=document.getElementById('bag');b.style.display=b.style.display==='block'?'none':'block';};let velY=0,canJ=true;function anim(){requestAnimationFrame(anim);if(controls.isLocked){if(inBoat){const sp=getBoatSp();if(keys['KeyW']){const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();boat.position.add(f.multiplyScalar(sp));controls.getObject().position.copy(boat.position);controls.getObject().position.y=3;boat.rotation.y=Math.atan2(f.x,f.z);}if(keys['KeyA'])boat.rotation.y+=0.03;if(keys['KeyD'])boat.rotation.y-=0.03;}else{const sp=keys['ShiftLeft']?0.33:0.18;if(keys['KeyW'])controls.moveForward(sp);if(keys['KeyS'])controls.moveForward(-sp);if(keys['KeyA'])controls.moveRight(-sp);if(keys['KeyD'])controls.moveRight(sp);velY-=0.02;controls.getObject().position.y+=velY;if(controls.getObject().position.y<=5){controls.getObject().position.y=5;velY=0;canJ=true;}if(keys['Space']&&canJ){velY=0.35;canJ=false;}}checkNear();if(monsters.length===0&&treasures.length===0&&islands[curIsland].t==='battle'&&!islands[curIsland].clear)spawnM(curIsland);}renderer.render(scene,camera);}anim();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
