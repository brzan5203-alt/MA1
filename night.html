<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA1 NIGHT SURVIVAL</title>
<style>
body{margin:0;background:#000;overflow:hidden;color:white;font-family:Arial}
canvas{display:block}
#ui{position:absolute;top:10px;width:100%;display:flex;justify-content:space-around;font-weight:bold}
#batBar{width:120px;height:15px;background:#333;border-radius:10px;overflow:hidden;border:1px solid gold}
#batFill{height:100%;background:linear-gradient(90deg,lime,yellow);width:100%;transition:0.2s}
#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:gold;color:black;padding:20px 40px;border:none;border-radius:15px;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div id="ui">
<div>💰 <span id="money">0</span></div>
<div style="display:flex;align-items:center;gap:5px">🔦<div id="batBar"><div id="batFill"></div></div><span id="batText">100%</span></div>
<div>❤️ <span id="hp">100</span></div>
</div>
<canvas id="g"></canvas>
<button id="start" onclick="start()">🌙 ابدأ ليل MA1 🔦</button>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let player={x:c.width/2,y:c.height/2,hp:100}, bat=100, money=parseInt(localStorage.getItem('ma1_night_money')||0), zombies=[], bats=[], bullets=[], run=false, mouse={x:c.width/2,y:c.height/2}, time=0;

function start(){ document.getElementById('start').style.display='none'; run=true; loop(); setInterval(spawnZ,1200); setInterval(spawnBat,6000); setInterval(()=>{if(run&&bat>0)bat-=0.7},100); setInterval(()=>{if(run)bullets.push({x:player.x,y:player.y,a:Math.atan2(mouse.y-player.y,mouse.x-player.x)})},250); }

function spawnZ(){ let ang=Math.random()*Math.PI*2, r=c.width; zombies.push({x:player.x+Math.cos(ang)*r,y:player.y+Math.sin(ang)*r,s:0.8+Math.random()*1.2}); }
function spawnBat(){ bats.push({x:Math.random()*c.width,y:Math.random()*c.height}); }

function loop(){
if(!run) return;
time+=0.02;
x.fillStyle='#050505'; x.fillRect(0,0,c.width,c.height);

// darkness + flashlight
x.save();
x.fillStyle='rgba(0,0,0,0.96)';
x.fillRect(0,0,c.width,c.height);
if(bat>0){
 let ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);
 x.globalCompositeOperation='destination-out';
 let grad=x.createRadialGradient(player.x,player.y,20, player.x+Math.cos(ang)*200, player.y+Math.sin(ang)*200, 280);
 grad.addColorStop(0,'rgba(0,0,0,1)'); grad.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=grad;
 x.beginPath(); x.moveTo(player.x,player.y);
 x.arc(player.x,player.y,300,ang-0.6,ang+0.6); x.lineTo(player.x,player.y); x.fill();
}
x.restore();

// batteries
x.font='25px Arial';
bats.forEach((b,i)=>{
 x.fillText('🔋',b.x,b.y);
 if(Math.hypot(player.x-b.x,player.y-b.y)<30){ bats.splice(i,1); bat=Math.min(100,bat+35); }
});

// player
x.font='35px Arial'; x.textAlign='center'; x.fillText('🧑‍✈️',player.x,player.y);

// zombies only visible in light
zombies.forEach((z,zi)=>{
 let d=Math.hypot(z.x-player.x,z.y-player.y);
 let ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);
 let angToZ=Math.atan2(z.y-player.y,z.x-player.x);
 let diff=Math.abs(ang-angToZ); if(diff>Math.PI) diff=2*Math.PI-diff;
 let inLight = bat>0 && d<320 && diff<0.7;
 if(inLight || d<80){
   x.font='40px Arial'; x.fillText('🧟',z.x,z.y);
 }
 let mv = inLight? 1.5 : 0.4;
 z.x+=(player.x-z.x)/d*mv; z.y+=(player.y-z.y)/d*mv;
 if(d<35){ zombies.splice(zi,1); player.hp-=15; if(player.hp<=0){ run=false; alert('💀 ماتت في الظلام! جمعت '+money); location.reload(); } }
 bullets.forEach((b,bi)=>{
  let bz=Math.hypot(z.x-b.x,z.y-b.y);
  if(bz<30){ zombies.splice(zi,1); bullets.splice(bi,1); money+=10; localStorage.setItem('ma1_night_money',money); }
 });
});

// bullets
bullets.forEach((b,i)=>{ b.x+=Math.cos(b.a)*8; b.y+=Math.sin(b.a)*8; x.fillStyle='yellow'; x.beginPath(); x.arc(b.x,b.y,5,0,Math.PI*2); x.fill(); if(b.x<0||b.x>c.width||b.y<0||b.y>c.height) bullets.splice(i,1); });

document.getElementById('money').innerText=money;
document.getElementById('hp').innerText=player.hp;
document.getElementById('batText').innerText=Math.floor(bat)+'%';
document.getElementById('batFill').style.width=bat+'%';
document.getElementById('batFill').style.background=bat<20?'red':bat<50?'orange':'lime';

requestAnimationFrame(loop);
}
window.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
window.addEventListener('touchmove',e=>{ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; player.x=e.touches[0].clientX; player.y=e.touches[0].clientY; });
</script>
</body>
</html>
